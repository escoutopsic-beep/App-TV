name: Build FrameXTV TCL APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.FXTV_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "FXTV_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Assinatura fixa ativada."
          else
            echo "::warning::Segredo FXTV_KEYSTORE_B64 ausente: APK assinado com chave temporaria (nao instala por cima de versoes anteriores)."
          fi
          echo "APP_VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_ENV"

      - name: Build release APK (R8 + shrink)
        env:
          FXTV_KEYSTORE_PASSWORD: ${{ secrets.FXTV_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/FrameXTV-TCL-v${APP_VERSION}.apk"
          ls -l out

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: FrameXTV-TCL-v${{ env.APP_VERSION }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30
